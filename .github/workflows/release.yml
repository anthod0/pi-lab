name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'

jobs:
  detect:
    name: Detect version changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          PACKAGES=()
          NULL_SHA="0000000000000000000000000000000000000000"

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$NULL_SHA" ]; then
            echo "No valid before SHA found; treating previous versions as empty"
            BEFORE_SHA=""
          else
            echo "Comparing package versions from $BEFORE_SHA to $GITHUB_SHA"
          fi

          for pkg_json in packages/*/package.json; do
            pkg_name=$(basename $(dirname $pkg_json))

            if [ -n "$BEFORE_SHA" ]; then
              OLD=$(git show "$BEFORE_SHA:$pkg_json" 2>/dev/null | jq -r '.version // empty')
            else
              OLD=""
            fi
            NEW=$(jq -r '.version // empty' $pkg_json)

            if [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
              echo "  $pkg_name: ${OLD:-<none>} → $NEW"
              PACKAGES+=("$pkg_name")
            fi
          done

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "No version changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            MATRIX=$(printf '%s\n' "${PACKAGES[@]}" | jq -R . | jq -sc '{package: .}')
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "./packages/${{ matrix.package }}" build

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' packages/${{ matrix.package }}/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          path: packages/${{ matrix.package }}/CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
          validation_level: error

      - name: Publish
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.package }}@${{ steps.version.outputs.version }}
          name: "${{ matrix.package }} v${{ steps.version.outputs.version }}"
          body_path: ${{ steps.changelog.outputs.changes_file }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
